<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ambient ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#synapseGlow)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.3" />
  
  <!-- Synaptic Hexagonal Geometry -->
  <path d="M24 5L41 15V33L24 43L7 33V15L24 5Z" stroke="url(#synapseGlow)" stroke-width="2" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Peripheral Synapse Nodes -->
  <circle cx="24" cy="5" r="2.5" fill="#38BDF8" filter="url(#bloom)" />
  <circle cx="41" cy="15" r="2.2" fill="#6366F1" />
  <circle cx="41" cy="33" r="2.2" fill="#818CF8" />
  <circle cx="24" cy="43" r="2.5" fill="#10B981" filter="url(#bloom)" />
  <circle cx="7" cy="33" r="2.2" fill="#34D399" />
  <circle cx="7" cy="15" r="2.2" fill="#38BDF8" />

  <!-- Inner Intersecting Healing Cross / Caduceus Beam -->
  <path d="M24 13V35M13 24H35" stroke="url(#synapseGlow)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Central Resilient Diamond Core -->
  <rect x="20.5" y="20.5" width="7" height="7" rx="1.5" transform="rotate(45 24 24)" fill="#FFFFFF" filter="url(#bloom)" />
</svg>
