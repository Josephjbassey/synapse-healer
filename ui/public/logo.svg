<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="logoBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(4, 2)">
    <circle cx="22" cy="22" r="20" stroke="url(#logoGrad)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.3" />
    <path d="M22 4L38 13V31L22 40L6 31V13L22 4Z" stroke="url(#logoGrad)" stroke-width="1.8" stroke-linejoin="round" opacity="0.9" />
    <circle cx="22" cy="4" r="2.2" fill="#38BDF8" filter="url(#logoBloom)" />
    <circle cx="38" cy="13" r="1.8" fill="#6366F1" />
    <circle cx="38" cy="31" r="1.8" fill="#818CF8" />
    <circle cx="22" cy="40" r="2.2" fill="#10B981" filter="url(#logoBloom)" />
    <circle cx="6" cy="31" r="1.8" fill="#34D399" />
    <circle cx="6" cy="13" r="1.8" fill="#38BDF8" />
    <path d="M22 12V32M12 22H32" stroke="url(#logoGrad)" stroke-width="2.6" stroke-linecap="round" />
    <rect x="19" y="19" width="6" height="6" rx="1" transform="rotate(45 22 22)" fill="#FFFFFF" filter="url(#logoBloom)" />
  </g>

  <!-- Typography -->
  <text x="56" y="27" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.5px">Synapse<tspan fill="url(#logoGrad)">Healer</tspan></text>
  <text x="56" y="38" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" letter-spacing="0.5px">AUTONOMOUS INTEROPERABILITY DLQ</text>
</svg>
